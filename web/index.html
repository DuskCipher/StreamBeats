<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StreamBeats - Pemutar musik gratis, bebas iklan, dengan sistem plugin canggih berbasis Rust.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StreamBeats">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StreamBeats</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 24px;
    }

    #app-icon {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      border: 2px solid #ffffff;
    }

    #app-name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffffff;
    }

    #app-tagline {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #aaaaaa;
      letter-spacing: 1px;
    }

    /* Loading bar */
    .loading-bar-wrapper {
      width: 200px;
      height: 3px;
      background-color: #333333;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 2px;
      animation: loadingAnim 2s ease-in-out infinite;
    }

    @keyframes loadingAnim {
      0%   { width: 0%; margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    #loading-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #666666;
      letter-spacing: 1px;
    }

    /* Hide loading screen once Flutter is ready */
    .flutter-loaded #loading-screen {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <img id="app-icon" src="icons/Icon-192.png" alt="StreamBeats Logo">
    <div id="app-name">StreamBeats</div>
    <div id="app-tagline">Pemutar Musik Bebas Iklan</div>
    <div class="loading-bar-wrapper">
      <div class="loading-bar"></div>
    </div>
    <div id="loading-text">Memuat aplikasi...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide loading screen when Flutter app is ready
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-loaded');
    });
  </script>
</body>
</html>
